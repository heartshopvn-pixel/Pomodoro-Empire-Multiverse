<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var filename = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
